# XcodeGen spec — the .xcodeproj is generated in CI rather than committed.
# A hand-maintained project.pbxproj is exactly the kind of file that rots silently;
# this stays readable and diffable instead.
name: EQAvatarTV
options:
  bundleIdPrefix: com.hokedesigns
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "3"          # 3 = Apple TV
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  EQAvatarTV:
    type: application
    platform: tvOS
    sources:
      - path: EQAvatarTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hokedesigns.eqavatar
        PRODUCT_NAME: EQ Avatar
        INFOPLIST_FILE: EQAvatarTV/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        # Without this, the 1280x768 "App Icon - App Store" layer stack is compiled but
        # NOT embedded in the .app, and App Store Connect rejects the upload with
        # "Missing Image Asset ... App Store Icon" (error 90471).
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Manual
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
