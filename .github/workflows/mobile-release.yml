name: mobile-release

# Deliberately a SEPARATE tag namespace from the desktop app (which builds on `v*`),
# so shipping the Windows client never triggers a mobile build and vice versa.
on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build and upload iOS to TestFlight'
        type: boolean
        default: false
      tvos:
        description: 'Also build and upload Apple TV to TestFlight'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --build-name "${GITHUB_REF_NAME#mobile-v}" --build-number "${GITHUB_RUN_NUMBER}"

      - name: Name the artifact
        run: mv build/app/outputs/flutter-apk/app-release.apk "EQAvatar-${GITHUB_REF_NAME#mobile-v}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/EQAvatar-*.apk

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/EQAvatar-*.apk
          body: |
            **EQ Avatar companion — Android**

            Download the APK below and open it on your phone (allow "install from
            unknown sources" once). Pair it with the access token from the members portal.

  ios:
    # Only when a tag ships or the workflow is dispatched with ios=true, because
    # macOS runner minutes bill at 10x.
    if: startsWith(github.ref, 'refs/tags/') || inputs.ios
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Install signing assets
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          # A throwaway keychain scoped to this runner, unlocked for the build only.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE" | base64 --decode > "$PROFILE_DIR/eqavatar.mobileprovision"

          # altool/xcodebuild look for the App Store Connect key here by convention.
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -p codesigning -v

      - name: Build signed IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_UUID: ${{ secrets.IOS_PROFILE_UUID }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#mobile-v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="0.1.0"

          # Archive unsigned, then sign during export.
          #
          # Two things forced this shape. `flutter build ipa` archives with the Xcode
          # project's own settings, and that project hardcodes CODE_SIGN_STYLE = Automatic
          # with an "iPhone Developer" identity, so CI fails with "No development
          # certificates available". But passing signing settings on the xcodebuild command
          # line is not the fix either: command-line settings apply to EVERY target,
          # including Flutter's plugin package targets, which reject a provisioning profile
          # outright ("does not support provisioning profiles"). Archiving with signing off
          # and letting -exportArchive apply the profile keeps signing scoped to the app.
          flutter build ios --release --no-codesign \
            --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"

          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.hokedesigns.eqavatar</key><string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)"
          echo "uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up secrets from the runner
        if: always()
        run: |
          rm -rf "$HOME/private_keys" \
                 "$HOME/Library/MobileDevice/Provisioning Profiles/eqavatar.mobileprovision" || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  tvos:
    # Apple TV app. Native Swift, because tvOS has no web view (so the phone's webview
    # player cannot run there) and Flutter has no official tvOS support. Same signing
    # certificate and App Store Connect record as iOS — only the profile differs.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tvos
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tvos
    steps:
      - uses: actions/checkout@v4

      - name: Generate brand assets and the Xcode project
        run: |
          set -euo pipefail
          # Both are generated, never committed: the layered tvOS icon/top-shelf art
          # (derived PNGs) and the .xcodeproj (a file that rots silently by hand).
          # The runner's Python is externally managed (PEP 668), so pip refuses to install
          # into it. A throwaway venv sidesteps that without fighting the system install.
          python3 -m venv "$RUNNER_TEMP/assetvenv"
          "$RUNNER_TEMP/assetvenv/bin/pip" install --quiet --upgrade pillow
          "$RUNNER_TEMP/assetvenv/bin/python" tools/make_brand_assets.py
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Install signing assets
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.TVOS_PROVISION_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/tv-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE" | base64 --decode > "$PROFILE_DIR/eqavatar-tvos.mobileprovision"

          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -p codesigning -v

      - name: Archive and export
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_UUID: ${{ secrets.TVOS_PROFILE_UUID }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#tv-v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="0.1.0"

          xcodebuild archive \
            -project EQAvatarTV.xcodeproj \
            -scheme EQAvatarTV \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -archivePath "$RUNNER_TEMP/EQAvatarTV.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.hokedesigns.eqavatar</key><string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EQAvatarTV.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist

      - name: Inspect the built app icons
        # Diagnostics only — never fail the job over a grep that finds nothing.
        continue-on-error: true
        run: |
          set -uo pipefail
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)"
          rm -rf "$RUNNER_TEMP/unz" && mkdir -p "$RUNNER_TEMP/unz"
          unzip -q -o "$IPA" -d "$RUNNER_TEMP/unz"
          APP="$(find "$RUNNER_TEMP/unz/Payload" -maxdepth 1 -name '*.app' | head -1)"

          echo "=== FULL Info.plist (platform + device family decide which icon rules Apple applies) ==="
          /usr/libexec/PlistBuddy -c 'Print' "$APP/Info.plist" || true

          echo "=== app-icon asset metadata (idiom / subtype / scale / role) ==="
          xcrun assetutil --info "$APP/Assets.car" > "$RUNNER_TEMP/assets.json" 2>/dev/null || true
          python3 - "$RUNNER_TEMP/assets.json" <<'PYEOF' || true
          import json, sys
          data = json.load(open(sys.argv[1]))
          for e in data:
              if not isinstance(e, dict):
                  continue
              name = e.get("Name", "")
              if "Icon" in name or "Shelf" in name:
                  keep = {k: v for k, v in e.items()
                          if k in ("Name","Idiom","Subtype","Scale","SizeOnDisk","RenditionName",
                                   "AssetType","Role","Appearance","PixelWidth","PixelHeight")}
                  print(json.dumps(keep, sort_keys=True))
          PYEOF

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)"
          echo "uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t tvos \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up secrets from the runner
        if: always()
        run: |
          rm -rf "$HOME/private_keys" \
                 "$HOME/Library/MobileDevice/Provisioning Profiles/eqavatar-tvos.mobileprovision" || true
          security delete-keychain "$RUNNER_TEMP/tv-signing.keychain-db" || true
