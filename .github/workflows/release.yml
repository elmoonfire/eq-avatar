name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: dotnet publish EQAvatar.Spike/EQAvatar.Spike.csproj -c Release -r win-x64 --self-contained false -o publish
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath EQAvatar.Spike.zip -Force
      - name: Create release with asset
        uses: softprops/action-gh-release@v2
        with:
          files: EQAvatar.Spike.zip
      - name: Update manifest
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/EQAvatar.Spike.zip"
          $obj = [ordered]@{ version = $ver; url = $url; notes = "EQ Avatar $ver" }
          $obj | ConvertTo-Json | Set-Content -Path latest.json -Encoding utf8
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add latest.json
          git commit -m "Update manifest to $ver"
          git push origin HEAD:main
