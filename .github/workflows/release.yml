name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = '0.0.0' }   # workflow_dispatch on a branch
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "building as $v"
      - name: Publish
        run: dotnet publish EQAvatar.Spike.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ steps.ver.outputs.value }} -o publish
      - name: Publish rescue tool
        run: dotnet publish Rescue/EQAvatarRescue.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.value }} -o rescue-publish
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item rescue-publish/EQAvatarRescue.exe publish/
          Compress-Archive -Path publish/* -DestinationPath EQAvatar.Spike.zip -Force
      - name: Create release with asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EQAvatar.Spike.zip
            rescue-publish/EQAvatarRescue.exe
      - name: Update manifest
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.value }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/EQAvatar.Spike.zip"
          $obj = [ordered]@{ version = $ver; url = $url; notes = "EQ Avatar $ver" }
          $obj | ConvertTo-Json | Set-Content -Path latest.json -Encoding utf8
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add latest.json
          git commit -m "Update manifest to $ver"
          git push origin HEAD:main
